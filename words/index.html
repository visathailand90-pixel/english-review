<style>
/* Layout: one narrow phone column — mode chips on top, one big card / question in the middle, controls under the thumb */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#18213a; --muted:#5d6782;
  --denim:#2f4a8a; --denim-soft:#dfe6f6; --tape:#f2c230; --tape-ink:#3a2c00;
  --good:#1f7a4d; --good-soft:#dcf1e6; --bad:#b23a3a; --bad-soft:#f7e0e0; --line:#d5dbe6;
  --display:"Unbounded", "Rubik", system-ui, sans-serif;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1422; --surface:#182036; --ink:#e8ecf6; --muted:#9aa5c2;
  --denim:#8fa8e8; --denim-soft:#243050; --tape:#f2c230; --tape-ink:#2a2000;
  --good:#5fd39a; --good-soft:#173a2a; --bad:#ef8a8a; --bad-soft:#3d1f24; --line:#2b3654; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1422; --surface:#182036; --ink:#e8ecf6; --muted:#9aa5c2;
  --denim:#8fa8e8; --denim-soft:#243050; --tape:#f2c230; --tape-ink:#2a2000;
  --good:#5fd39a; --good-soft:#173a2a; --bad:#ef8a8a; --bad-soft:#3d1f24; --line:#2b3654; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 28px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:1.15rem;margin:0;letter-spacing:.01em}
.pack{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
  padding:8px 13px;font:500 .88rem var(--body);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:var(--surface)}
.chip .best{font-size:.72rem;opacity:.8;font-variant-numeric:tabular-nums}
.rule{font-size:.85rem;color:var(--muted);margin:0}
/* flashcard */
.stage{perspective:1200px}
.card{position:relative;height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s ease;touch-action:pan-y}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
  border-radius:22px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:22px;text-align:center;box-shadow:0 10px 30px -18px rgba(20,30,60,.45)}
.face.back{transform:rotateY(180deg);background:var(--denim-soft)}
.stitch{position:absolute;inset:9px;border:1.5px dashed var(--line);border-radius:16px;pointer-events:none}
.face.back .stitch{border-color:color-mix(in srgb, var(--denim) 35%, transparent)}
.tag{position:absolute;top:18px;left:20px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.word{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1.1;word-break:break-word}
.form{font-size:.9rem;color:var(--muted)}
.pron{font-size:1.15rem;color:var(--denim);font-weight:500}
.hint{position:absolute;bottom:18px;font-size:.78rem;color:var(--muted)}
.ru{font-family:var(--display);font-size:1.6rem;font-weight:500}
.ex{font-size:1rem;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.ex b{font-weight:600}
.exru{font-size:.92rem;color:var(--muted);margin-top:-6px}
.note{background:var(--tape);color:var(--tape-ink);font-size:.85rem;font-weight:500;padding:6px 10px;border-radius:8px;max-width:100%}
.say{border:none;background:var(--denim);color:var(--surface);border-radius:999px;display:inline-flex;align-items:center;gap:6px;
  padding:10px 16px;font:500 .9rem var(--body);cursor:pointer}
.say.small{padding:6px 10px;font-size:.8rem}
.say.ghost{background:transparent;color:var(--denim);border:1.5px solid var(--denim)}
.say svg{width:18px;height:18px;flex:none}
.say.small svg{width:15px;height:15px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 14px;
  font:500 .95rem var(--body);cursor:pointer}
.btn.primary{background:var(--denim);color:var(--surface);border-color:var(--denim)}
.btn:disabled{opacity:.4;cursor:default}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;text-align:center;min-width:64px}
.toggles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
/* quiz */
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);width:0;transition:width .25s}
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qprompt{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.qprompt .word{font-size:2rem}
.qprompt .ru{font-size:1.5rem}
.sent{font-size:1.15rem;font-weight:500;line-height:1.5}
.gap{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--tape);color:var(--denim);font-weight:600}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:13px 14px;
  font:500 1rem var(--body);cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt .l{font-weight:600;color:var(--muted);width:1.1em;flex:none}
.opt .p{color:var(--muted);font-weight:400;font-size:.88rem}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
input[type=text]{width:100%;font:500 1.2rem var(--body);padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);text-align:center}
input[type=text]:focus{outline:2.5px solid var(--denim);outline-offset:1px}
.letter{font-family:var(--display);font-size:1.3rem;letter-spacing:.18em;color:var(--denim)}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ans{color:var(--ink);font-size:1.05rem}
.fb .ans b{font-family:var(--display);font-weight:700}
.fb .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink)}
.res{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;text-align:center}
.big{font-family:var(--display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.verdict{font-weight:600}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.miss span{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:5px 11px;font-size:.88rem;font-weight:500}
.copy{font-size:.85rem;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px;text-align:left;white-space:pre-wrap;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px)}
button:focus-visible,.chip:focus-visible{outline:2.5px solid var(--tape);outline-offset:2px}
.phl{display:flex;flex-direction:column;gap:12px}
.ph{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ph h3{margin:0;font-family:var(--display);font-size:1.05rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ph h3 span{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
.pi{display:flex;gap:10px;align-items:flex-start}
.pi .t{flex:1;min-width:0}
.pi .e{font-weight:600}
.pi .r{font-size:.9rem;color:var(--muted)}
.idiom{display:inline-block;background:var(--tape);color:var(--tape-ink);font-size:.7rem;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.05em}
@media (prefers-reduced-motion: reduce){.card{transition:none}.bar i{transition:none}}
</style>

let voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,slow){
  if(!("speechSynthesis" in window)){toast("Озвучка не поддерживается в этом браузере. Открой страницу в Chrome или Safari.");return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang = voice? voice.lang : "en-GB"; if(voice)u.voice=voice;
    u.rate = slow?0.6:0.9;
    speechSynthesis.speak(u);
  }catch(e){toast("Не получилось включить звук");}
}
function sayBtn(text,cls="",label=""){

/* ---------- helpers ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function distractors(idx,n=3){
  const w=W[idx];
  let pool=shuffle(W.map((x,i)=>i).filter(i=>i!==idx&&W[i].g===w.g));
  if(pool.length<n)pool=pool.concat(shuffle(W.map((x,i)=>i).filter(i=>i!==idx&&!pool.includes(i))));
  return pool.slice(0,n);
}
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,"");

  let x0=null,y0=null;
  card.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  card.addEventListener("touchend",e=>{
    if(x0==null)return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;

function go(d){

}
document.addEventListener("keydown",e=>{
  if(mode!=="cards"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1);
});

/* ---------- rounds ---------- */
function startRound(m,subset){
  const ids=subset||W.map((x,i)=>i);
  Q={mode:m,order:shuffle(ids),i:0,score:0,wrong:[],answered:false,full:!subset,opts:null,last:null,done:false};
}
function renderQ(){
  const app=document.getElementById("app");
  const m=MODES.find(x=>x.id===Q.mode);
  const idx=Q.order[Q.i], w=W[idx];
  if(!Q.opts && ["r1","r2","r3"].includes(Q.mode)) Q.opts=shuffle([idx,...distractors(idx)]);
  let prompt="", body="";
  if(Q.mode==="r1"){
    prompt=`<div class="word">${w.en}</div><div class="pron">[${w.pr}]</div>${sayBtn(w.en,"small","Слушать")}`;
    body=optsHtml(i=>W[i].ru);
  } else if(Q.mode==="r2"){
    prompt=`<div class="ru">${w.ru}</div>`;
    body=optsHtml(i=>`${W[i].en} <span class="p">[${W[i].pr}]</span>`);
  } else if(Q.mode==="r3"){
    prompt=`<div class="sent">${w.s.replace("___",'<span class="gap">'+(Q.answered?W[Q.last.pick].en:"&nbsp;")+'</span>')}</div><div class="exru">(${w.sru})</div>`;
    body=optsHtml(i=>W[i].en);
  } else {
    const hint = Q.mode==="r4" ? `<div class="letter">${w.en[0]}${"_".repeat(Math.max(w.en.length-1,0))}</div><div class="exru">${w.en.length} букв${w.en.includes(" ")?" (с пробелом)":w.en.includes("-")?" (с дефисом)":""}</div>` : "";
    prompt=`<div class="ru">${w.ru}</div>${hint}`;
    body=`<form id="wf" autocomplete="off"><input type="text" id="win" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="пиши по-английски" ${Q.answered?"disabled":""} value="${Q.answered?Q.last.typed.replace(/"/g,"&quot;"):""}"></form>
      ${Q.answered?"":`<button class="btn primary" type="button" id="check">Проверить</button>`}`;
  }
  app.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="bar"><i style="width:${(Q.i/Q.order.length)*100}%"></i></div>
    <div class="q">
      <div class="qhead"><span>${m.title}</span><span>${Q.i+1} / ${Q.order.length} · ✓ ${Q.score}</span></div>
      <div class="qprompt">${prompt}</div>
      ${body}
      ${Q.answered?fbHtml(w):""}
      ${Q.answered?`<button class="btn primary" type="button" id="nextq">${Q.i===Q.order.length-1?"Итог →":"Дальше →"}</button>`:""}
    </div>
  </div>`;
  if(["r1","r2","r3"].includes(Q.mode)){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  } else if(!Q.answered){
    const inp=document.getElementById("win"); inp.focus();
    document.getElementById("wf").onsubmit=e=>{e.preventDefault();answerTyped(inp.value)};
    document.getElementById("check").onclick=()=>answerTyped(inp.value);
  }
  const nb=document.getElementById("nextq"); if(nb){nb.onclick=nextQ; nb.focus({preventScroll:true});}
}
function optsHtml(lbl){
  return `<div class="opts">${Q.opts.map((i,k)=>{
    let c=""; if(Q.answered){ if(i===Q.order[Q.i])c="ok"; else if(i===Q.last.pick)c="no"; }
    return `<button class="opt ${c}" type="button" data-i="${i}" ${Q.answered?"disabled":""}><span class="l">${"abcd"[k]}</span><span>${lbl(i)}</span></button>`;
  }).join("")}</div>`;
}
function fbHtml(w){
  const ok=Q.last.ok;
  return `<div class="fb ${ok?"ok":"no"}">
    <strong>${ok?"✅ Верно":"❌ Ошибка"}</strong>
    <div class="line"><span class="ans"><b>${w.en}</b> [${w.pr}] — ${w.ru}</span>${sayBtn(w.en,"small")}</div>
    ${!ok&&w.note?`<div class="note">${w.note}</div>`:""}
  </div>`;
}
function answer(pick){
  if(Q.answered)return;
  const idx=Q.order[Q.i], ok=pick===idx;
  record(ok,idx); Q.last={pick,ok}; Q.answered=true; renderQ();
  if(autoSay)say(W[idx].en);
}
function answerTyped(v){
  if(Q.answered)return;
  if(!v.trim()){toast("Напиши слово");return;}
  const idx=Q.order[Q.i], ok=norm(v)===norm(W[idx].en);
  record(ok,idx); Q.last={typed:v.trim(),ok}; Q.answered=true; renderQ();
  if(autoSay)say(W[idx].en);
}
function record(ok,idx){ if(ok)Q.score++; else if(!Q.wrong.includes(idx))Q.wrong.push(idx); }
function nextQ(){
  if(Q.i===Q.order.length-1){
    Q.done=true;
    if(Q.full){ if(best[Q.mode]==null||Q.score>best[Q.mode]){best[Q.mode]=Q.score;store.set(P.id+":best",best);} }
    render(); return;
  }
  Q.i++; Q.answered=false; Q.opts=null; Q.last=null; renderQ();
}
function renderResult(){
  const m=MODES.find(x=>x.id===Q.mode), tot=Q.order.length;
  const need = passMark(tot);
  const pass = Q.full ? Q.score>=need : Q.wrong.length===0;
  const nm = MODES[MODES.findIndex(x=>x.id===Q.mode)+1];
  const nextMode = nm && nm.id[0]==="r" ? nm : null;
  const text = `Пачка ${P.n}. ${m.title}: ${Q.score}/${tot}${Q.full?"":" (повтор ошибок)"}\nОшибки: ${Q.wrong.length?Q.wrong.map(i=>W[i].en).join(", "):"нет"}`;
  document.getElementById("app").innerHTML=`
  <div class="res">
    <div class="qhead" style="justify-content:center"><span>${m.title}</span></div>
    <div class="big">${Q.score} / ${tot}</div>
    <div class="verdict ${pass?"ok":"no"}">${Q.full ? (pass?"Круг сдан. Можно дальше.":`Нужно ${need} из ${tot}. Повтори ошибки и пройди круг ещё раз.`) : (pass?"Ошибки исправлены. Теперь пройди весь круг заново.":"Ещё есть ошибки, повтори их.")}</div>
    ${Q.wrong.length?`<div class="miss">${Q.wrong.map(i=>`<span>${W[i].en} — ${W[i].ru}</span>`).join("")}</div>`:""}
    <div class="row">
      ${Q.wrong.length?`<button class="btn primary" type="button" id="rw">Повторить ошибки</button>`:""}
      <button class="btn" type="button" id="ra">Весь круг заново</button>
      ${pass&&Q.full&&nextMode?`<button class="btn primary" type="button" id="nx">${nextMode.label} →</button>`:""}
    </div>
    <div class="copy" id="ct">${text}</div>
    <button class="btn" type="button" id="cp">Скопировать результат для чата</button>
  </div>`;
  const w=Q.wrong.slice();
  const rw=document.getElementById("rw"); if(rw)rw.onclick=()=>{startRound(Q.mode,w);render();};
  document.getElementById("ra").onclick=()=>{startRound(Q.mode);render();};
  const nx=document.getElementById("nx"); if(nx)nx.onclick=()=>{mode=nextMode.id;startRound(mode);render();};
  document.getElementById("cp").onclick=()=>{
    const done=()=>toast("Скопировано. Вставь в чат.");
    try{navigator.clipboard.writeText(text).then(done,()=>{selectCopy();toast("Выдели текст выше и скопируй");});}
    catch(e){selectCopy();toast("Выдели текст выше и скопируй");}
  };
}
function selectCopy(){const r=document.createRange();r.selectNodeContents(document.getElementById("ct"));const s=getSelection();s.removeAllRanges();s.addRange(r);}

{ const sp=store.get("pack",1); if(PACKS[sp]){P=PACKS[sp];W=P.words;best=store.get(P.id+":best",{});cardOrder=W.map((x,k)=>k);} }
render();
</script>
